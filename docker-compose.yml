services:
  postgres:
    image: postgres:16-alpine
    container_name: voone-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: voone
      POSTGRES_PASSWORD: voone
      POSTGRES_DB: voone
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: voone-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data:
